  .bar-top {

    justify-content: space-between;
    gap: 12px;

    color: var(--muted);

  }
  .score { font-variant-numeric: tabular-nums; }
  .score b { color: var(--text); font-weight: 600; }

  .track {

    background: var(--line);
    border-radius: 999px;

  }
  .fill {

    width: 0;
    background: var(--accent);

  .card {

  .topic-btn {

    font: inherit;
    color: inherit;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .15s ease, border-color .15s ease;

  .topic-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .topic-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .topic-btn .name { flex: 1; font-weight: 550; }
  .topic-btn .count {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .topic-btn .arrow { color: var(--muted); font-size: 17px; line-height: 1; }
  .topic-btn:hover .arrow, .topic-btn:hover .count { color: var(--accent); }

  .topic-btn.all {
    margin-top: 7px;
    border-style: dashed;
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .topic-btn.all .name { color: var(--accent); }
  .topic-btn.all .count, .topic-btn.all .arrow { color: var(--accent); }

  /* ---------- quiz ---------- */
  .topic {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1.q {
    font-size: 19px;
    line-height: 1.45;
    font-weight: 600;
    margin: 0 0 18px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt {
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 13px 15px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    transition: background .15s ease, border-color .15s ease;
  }
  .opt:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .key {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;

  .opt.correct .key { background: var(--good); border-color: var(--good); color: #fff; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-line); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }

    padding: 13px 15px;
    border-radius: 11px;
    border: 1px solid var(--line);
    font-size: 15px;

  .verdict.good .label { color: var(--good); }
  .verdict.bad .label { color: var(--bad); }

    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    min-height: 42px;

  .btn {

    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;

  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); filter: none; }
  .btn.ghost:hover { background: var(--accent-soft); }

  .link {
    font: inherit;
    font-size: 14px;
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    cursor: pointer;
  }
  .link:hover { color: var(--accent); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .hidden { display: none !important; }

  .result .big {

    font-weight: 700;
    letter-spacing: -.02em;

  .result .which { font-size: 13px; color: var(--muted); margin-bottom: 2px; }

</style>
</head>

const $ = id => document.getElementById(id);

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
// escape first, then turn `...` into <code>
function fmt(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// topics in the order they appear in the notes
const TOPICS = [];
QUESTIONS.forEach(q => { if (!TOPICS.includes(q.section)) TOPICS.push(q.section); });

const ALL = '__all__';
let topic = null, order = [], idx = 0, score = 0, answered = false, perSection = {};

/* ---------------- menu ---------------- */

function buildMenu() {
  const box = $('topics');
  box.innerHTML = '';

  TOPICS.forEach(name => {
    const n = QUESTIONS.filter(q => q.section === name).length;
    box.appendChild(topicButton(name, name, `${n} question${n === 1 ? '' : 's'}`, false));
  });

  box.appendChild(topicButton(ALL, 'All topics', `${QUESTIONS.length} questions`, true));
}

function topicButton(value, label, count, isAll) {
  const b = document.createElement('button');
  b.className = 'topic-btn' + (isAll ? ' all' : '');
  b.innerHTML =
    `<span class="name">${esc(label)}</span>` +
    `<span class="count">${count}</span>` +
    `<span class="arrow">&rsaquo;</span>`;
  b.addEventListener('click', () => startTopic(value));
  return b;
}

function showMenu() {
  topic = null;
  $('menu').classList.remove('hidden');
  $('quiz').classList.add('hidden');
  $('results').classList.add('hidden');
  $('header').classList.add('hidden');
  window.scrollTo(0, 0);
}

/* ---------------- quiz ---------------- */

function startTopic(which) {
  topic = which;
  const pool = QUESTIONS
    .map((q, i) => i)
    .filter(i => which === ALL || QUESTIONS[i].section === which);

  order = shuffle(pool);
  idx = 0;
  score = 0;
  perSection = {};

  $('menu').classList.add('hidden');
  $('results').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  $('header').classList.remove('hidden');
  render();
  window.scrollTo(0, 0);
}

function topicLabel() {
  return topic === ALL ? 'All topics' : topic;
}

function render() {
  answered = false;
  const q = QUESTIONS[order[idx]];

  $('progress').textContent = `Question ${idx + 1} of ${order.length}`;
  $('score').innerHTML = `Score <b>${score}</b> / ${idx}`;
  $('fill').style.width = (idx / order.length * 100) + '%';

  $('topic').textContent = q.section || '';
  $('topic').classList.toggle('hidden', !q.section);
  $('question').innerHTML = fmt(q.q);

  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="key">${i + 1}</span><span>${fmt(opt)}</span>`;
    b.addEventListener('click', () => choose(i));
    box.appendChild(b);
  });

  const v = $('verdict');
  v.className = 'verdict hidden';
  v.innerHTML = '';
  $('next').classList.add('hidden');
  $('hint').textContent = 'Pick an answer — or press 1-9';
}

function choose(picked) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[order[idx]];
  const right = picked === q.answer;
  if (right) score++;

  const sec = q.section || 'Other';
  if (!perSection[sec]) perSection[sec] = { right: 0, total: 0 };
  perSection[sec].total++;
  if (right) perSection[sec].right++;

  [...$('options').children].forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const v = $('verdict');
  v.className = 'verdict ' + (right ? 'good' : 'bad');
  let html = `<span class="label">${right ? 'Correct' : 'Not quite'}</span>`;
  if (!right) html += ` — the answer is <strong>${fmt(q.options[q.answer])}</strong>`;
  if (q.explanation) html += `<p>${fmt(q.explanation)}</p>`;
  v.innerHTML = html;

  $('score').innerHTML = `Score <b>${score}</b> / ${idx + 1}`;
  $('fill').style.width = ((idx + 1) / order.length * 100) + '%';

  const next = $('next');
  next.textContent = idx + 1 < order.length ? 'Next' : 'See results';
  next.classList.remove('hidden');
  next.focus();
  $('hint').textContent = 'Press Enter to continue';
}

function advance() {
  idx++;
  if (idx < order.length) render();
  else finish();
}

/* ---------------- results ---------------- */

function finish() {
  $('quiz').classList.add('hidden');
  $('results').classList.remove('hidden');

  const pct = Math.round(score / order.length * 100);
  $('whichTopic').textContent = topicLabel();
  $('finalPct').textContent = pct + '%';
  $('finalScore').textContent = `${score} of ${order.length} correct`;
  $('verdictTitle').textContent =
    pct >= 90 ? 'Exam ready' : pct >= 75 ? 'Nearly there' : pct >= 50 ? 'Worth another pass' : 'Back to the notes';
  $('progress').textContent = `Finished — ${order.length} questions`;
  $('fill').style.width = '100%';

  // the per-section table only tells you anything when more than one section ran
  const sections = Object.keys(perSection);
  const bd = $('breakdown');
  if (sections.length > 1) {
    const rows = $('rows');
    rows.innerHTML = '';
    TOPICS.filter(t => perSection[t]).forEach(name => {
      const s = perSection[name];
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML = `<span>${esc(name)}</span><span>${s.right} / ${s.total}</span>`;
      rows.appendChild(div);
    });
    bd.classList.remove('hidden');
  } else {
    bd.classList.add('hidden');
  }

  $('again').focus();
  window.scrollTo(0, 0);
}

/* ---------------- wiring ---------------- */

$('next').addEventListener('click', advance);
$('again').addEventListener('click', () => startTopic(topic));
$('back').addEventListener('click', showMenu);
$('quit').addEventListener('click', showMenu);

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;   // only while a question is up
  if (!answered && /^[1-9]$/.test(e.key)) {
    const i = Number(e.key) - 1;
    if (i < QUESTIONS[order[idx]].options.length) { e.preventDefault(); choose(i); }
  } else if (answered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    advance();
  } else if (e.key === 'Escape') {
    showMenu();
  }
});

buildMenu();
showMenu();
</script>
